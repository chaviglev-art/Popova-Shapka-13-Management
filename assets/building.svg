<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" width="520" height="620">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2440"/><stop offset="1" stop-color="#2d3b63"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3ecdd"/><stop offset="1" stop-color="#e2d7c2"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9ad95"/><stop offset="1" stop-color="#8f8570"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fb4d9"/><stop offset="1" stop-color="#3f6a99"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#e0a24a"/></linearGradient>
  </defs>
  <rect width="520" height="620" fill="url(#sky)"/>
  <!-- moon & stars -->
  <circle cx="430" cy="80" r="26" fill="#f4ecdc" opacity=".9"/>
  <circle cx="440" cy="72" r="24" fill="#1e2846"/>
  <g fill="#f4ecdc" opacity=".7"><circle cx="70" cy="60" r="1.8"/><circle cx="130" cy="110" r="1.4"/><circle cx="330" cy="50" r="1.6"/><circle cx="380" cy="150" r="1.2"/><circle cx="60" cy="170" r="1.3"/></g>
  <!-- neighbouring silhouettes -->
  <rect x="0" y="230" width="90" height="390" fill="#141b33"/>
  <rect x="440" y="260" width="80" height="360" fill="#141b33"/>
  <!-- main building -->
  <rect x="100" y="140" width="330" height="480" fill="url(#wall)"/>
  <rect x="100" y="140" width="330" height="8" fill="#cbbfa6"/>
  <!-- roof terrace -->
  <rect x="120" y="112" width="290" height="30" fill="#d9cfb8"/>
  <rect x="140" y="96" width="250" height="18" fill="url(#glass)" opacity=".8"/>
  <!-- floors of arched windows -->
  <g id="floor">
    <path d="M132 210 v-40 a22 22 0 0 1 44 0 v40 z" fill="url(#glass)"/>
    <path d="M132 210 v-40 a22 22 0 0 1 44 0 v40 z" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/>
    <path d="M154 148 v62 M132 182 h44" stroke="#fff" stroke-width="2" opacity=".6"/>
    <path d="M222 210 v-40 a22 22 0 0 1 44 0 v40 z" fill="url(#glass)"/>
    <path d="M222 210 v-40 a22 22 0 0 1 44 0 v40 z" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/>
    <path d="M244 148 v62 M222 182 h44" stroke="#fff" stroke-width="2" opacity=".6"/>
    <path d="M312 210 v-40 a22 22 0 0 1 44 0 v40 z" fill="url(#warm)"/>
    <path d="M312 210 v-40 a22 22 0 0 1 44 0 v40 z" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/>
    <path d="M334 148 v62 M312 182 h44" stroke="#fff" stroke-width="2" opacity=".6"/>
    <!-- balcony -->
    <rect x="124" y="210" width="240" height="10" fill="#cbbfa6"/>
    <g stroke="#7c7461" stroke-width="2"><path d="M128 196 h232 M128 196 v14 M360 196 v14 M160 196 v14 M192 196 v14 M224 196 v14 M256 196 v14 M288 196 v14 M320 196 v14"/></g>
  </g>
  <use href="#floor" y="100"/>
  <use href="#floor" y="200"/>
  <use href="#floor" y="300"/>
  <!-- ground floor: stone cladding + entrance arch -->
  <rect x="100" y="520" width="330" height="100" fill="url(#stone)"/>
  <g stroke="#6f6754" stroke-width="1.5" opacity=".6">
    <path d="M100 545 h330 M100 570 h330 M100 595 h330"/>
    <path d="M140 520 v25 M180 545 v25 M220 520 v25 M260 545 v25 M300 520 v25 M340 545 v25 M380 520 v25 M160 570 v25 M240 570 v25 M320 570 v25 M400 570 v25"/>
  </g>
  <path d="M232 620 v-56 a33 33 0 0 1 66 0 v56 z" fill="#1d2338"/>
  <path d="M232 620 v-56 a33 33 0 0 1 66 0 v56 z" fill="none" stroke="#c9a96e" stroke-width="4"/>
  <path d="M265 531 v89 M240 575 h50 M248 552 q17 -14 34 0" stroke="#c9a96e" stroke-width="2.5" fill="none" opacity=".9"/>
  <!-- steps -->
  <rect x="216" y="608" width="98" height="6" fill="#9c927c"/><rect x="208" y="614" width="114" height="6" fill="#857c68"/>
  <!-- awning -->
  <path d="M226 556 h78 l6 -14 h-90 z" fill="#3b6b4f"/>
  <!-- house number plaque -->
  <rect x="318" y="545" width="30" height="20" rx="3" fill="#1d2338" stroke="#c9a96e" stroke-width="1.5"/>
  <text x="333" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#f4ecdc">13</text>
  <!-- tree -->
  <rect x="452" y="560" width="8" height="60" fill="#2b2418"/>
  <circle cx="456" cy="540" r="34" fill="#2f5a46"/><circle cx="438" cy="556" r="22" fill="#3b6b4f"/>
</svg>
