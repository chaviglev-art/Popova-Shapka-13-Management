    <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f4ecdc" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f4ecdc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="doorGlow" cx=".5" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffd98f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd98f" stop-opacity="0"/>
    </radialGradient>
  </defs>

