<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1000" width="700" height="1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a30"/>
      <stop offset=".55" stop-color="#232c4d"/>
      <stop offset="1" stop-color="#40355a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9dfc9"/>
      <stop offset=".5" stop-color="#f4ecdc"/>
      <stop offset="1" stop-color="#e3d7bd"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a99c81"/>
      <stop offset="1" stop-color="#8a7d64"/>
